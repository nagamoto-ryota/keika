<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ケイカ{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% if sample %}<div class="demo">見本モードです。同梱の結果を表示していて、Claude は呼びません。</div>{% endif %}
  {% if as_of %}<div class="demo">デモ基準日 {{ as_of }}（架空データで動いています）</div>{% endif %}
  <header class="top">
    <a class="logo" href="/">ケイカ</a>
    <nav>
      <a href="/records/new" class="primary">記録する</a>
      <a href="/">やること</a>
      <a href="/board">一覧</a>
    </nav>
  </header>
  <main>{% block main %}{% endblock %}</main>
  <footer>記録の下書きと指摘は AI（Claude）が作ります。指摘はすべて「確認してください」という形のお知らせです。法的助言や監査の代わりではありません。最終判断は事業所と保険者にあります。 <a class="no-print" href="/guide">導入の前に</a></footer>
</body>
</html>
