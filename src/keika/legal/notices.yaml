- rule: R01
  doc: "老企第22号（平成27年度改定とみられる新旧対照表・改正後の欄）"
  where: "第二の３⑺⑮ 居宅サービス計画の変更の必要性についてのサービス担当者会議等による専門的意見の聴取（第15号）［平成27年度改定時の番号］"
  source: rokig22_h27
  url: https://www.mhlw.go.jp/file/06-Seisakujouhou-12300000-Roukenkyoku/0000080876.pdf
  quote: |-
    介護支援専門員は、利用者が要介護状態区分の変更の認定を受けた場合など本号に掲げる場合には、サービス担当者会議の開催により、居宅サービス計画の変更の必要性について、担当者から、専門的な見地からの意見を求めるものとする。ただし、やむを得ない理由がある場合については、サービス担当者に対する照会等により意見を求めることができるものとする。なお、ここでいうやむを得ない理由がある場合とは、開催の日程調整を行ったが、サービス担当者の事由により、サービス担当者会議への参加が得られなかった場合や居宅サービス計画の変更から間もない場合で利用者の状態に大きな変化が見られない場合等が想定される。
- rule: R01
  doc: "介護保険最新情報Vol.959（令和3年3月31日）別添"
  where: "ケアプランの軽微な変更に関するサービス担当者会議の全事業所招集の必要性"
  source: vol959
  url: https://www.mhlw.go.jp/content/000778912.pdf
  quote: |-
    ケアプランの「軽微な変更」に該当するものであれば、サービス担当者会議の開催など、必ずしも実施しなければならないものではない。
    ただし、サービス担当者会議を開催する必要がある場合には、必ずしもケアプランに関わるすべての事業所を招集する必要はなく、基準の解釈通知に定めているように、やむを得ない理由がある場合として照会等により意見を求めることが想定される。
- rule: R02
  doc: "老企第22号（平成27年度改定とみられる新旧対照表・改正後の欄）"
  where: "第二の３⑺⑧ 居宅サービス計画原案の作成（第８号）［平成27年度改定時の番号］"
  source: rokig22_h27
  url: https://www.mhlw.go.jp/file/06-Seisakujouhou-12300000-Roukenkyoku/0000080876.pdf
  quote: |-
    介護支援専門員は、居宅サービス計画が利用者の生活の質に直接影響する重要なものであることを十分に認識し、居宅サービス計画原案を作成しなければならない。したがって、居宅サービス計画原案は、利用者の希望及び利用者についてのアセスメントの結果による専門的見地に基づき、利用者の家族の希望及び当該地域における指定居宅サービス等が提供される体制を勘案した上で、実現可能なものとする必要がある。
- rule: R02
  doc: "老企第22号（平成27年度改定とみられる新旧対照表・改正後の欄）"
  where: "第二の３⑺⑧ 居宅サービス計画原案の作成（第８号）［平成27年度改定時の番号］"
  source: rokig22_h27
  url: https://www.mhlw.go.jp/file/06-Seisakujouhou-12300000-Roukenkyoku/0000080876.pdf
  quote: |-
    また、当該居宅サービス計画原案には、利用者及びその家族の生活に対する意向及び総合的な援助の方針並びに生活全般の解決すべき課題を記載した上で、提供されるサービスについて、その長期的な目標及びそれを達成するための短期的な目標並びにそれらの達成時期等を明確に盛り込み、当該達成時期には居宅サービス計画及び各指定居宅サービス等の評価を行い得るようにすることが重要である。
