- rule: R28
  doc: "老企第22号（令和3年度改定の新旧対照表・新の欄）"
  where: "第２の３⒀④ 勤務体制の確保［令和3年度改定時の番号］"
  source: rokig22_r3
  url: https://www.mhlw.go.jp/content/12300000/000869800.pdf
  quote: |-
    同条第４項は、雇用の分野における男女の均等な機会及び待遇の確保等に関する法律（昭和47年法律第113号）第11条第１項及び労働施策の総合的な推進並びに労働者の雇用の安定及び職業生活の充実等に関する法律（昭和41年法律第132号）第30条の２第１項の規定に基づき、事業主には、職場におけるセクシュアルハラスメントやパワーハラスメント（以下「職場におけるハラスメント」という。）の防止のための雇用管理上の措置を講じることが義務づけられていることを踏まえ、規定したものである。事業主が講ずべき措置の具体的内容及び事業主が講じることが望ましい取組については、次のとおりとする。なお、セクシュアルハラスメントについては、上司や同僚に限らず、利用者やその家族等から受けるものも含まれることに留意すること。
