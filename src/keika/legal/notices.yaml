# 指摘の根拠として画面に出す、解釈通知と Q&A の原文。quote は sources/ の同名ファイルの本文と空白・改行を除いて一致する。
# 老企第22号は現行の全文を一つにまとめた公式文書が見つからなかったので、改正ごとの新旧対照表から、その箇所が最後に載った版を引いている。
- rule: R01
  doc: "老企第22号（令和6年度改定の新旧対照表・新の欄）"
  where: "第２の３⑻⑨ サービス担当者会議等による専門的意見の聴取（第９号）"
  source: rokig22_r6
  url: https://www.mhlw.go.jp/content/12300000/001227941.pdf
  quote: |-
    介護支援専門員は、効果的かつ実現可能な質の高い居宅サービス計画とするため、各サービスが共通の目標を達成するために具体的なサービスの内容として何ができるかなどについて、利用者やその家族、居宅サービス計画原案に位置付けた指定居宅サービス等の担当者からなるサービス担当者会議の開催により、利用者の状況等に関する情報を当該担当者等と共有するとともに、専門的な見地からの意見を求め調整を図ることが重要である。
- rule: R01
  doc: "老企第22号（令和6年度改定の新旧対照表・新の欄）"
  where: "第２の３⑻⑨ サービス担当者会議等による専門的意見の聴取（第９号）"
  source: rokig22_r6
  url: https://www.mhlw.go.jp/content/12300000/001227941.pdf
  quote: |-
    また、やむを得ない理由がある場合については、サービス担当者に対する照会等により意見を求めることができるものとしているが、この場合にも、緊密に相互の情報交換を行うことにより、利用者の状況等についての情報や居宅サービス計画原案の内容を共有できるようにする必要がある。なお、ここでいうやむを得ない理由がある場合とは、利用者（末期の悪性腫瘍の患者に限る。）の心身の状況等により、主治の医師又は歯科医師（以下「主治の医師等」という。）の意見を勘案して必要と認める場合のほか、開催の日程調整を行ったが、サービス担当者の事由により、サービス担当者会議への参加が得られなかった場合、居宅サービス計画の変更であって、利用者の状態に大きな変化が見られない等における軽微な変更の場合等が想定される。
