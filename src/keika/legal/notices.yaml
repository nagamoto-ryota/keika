- rule: R04
  doc: "老企第22号（令和6年度改定の新旧対照表・新の欄）"
  where: "第２の３⑻㉔ 福祉用具貸与及び特定福祉用具販売の居宅サービス計画への反映（第22号・第23号）"
  source: rokig22_r6
  url: https://www.mhlw.go.jp/content/12300000/001227941.pdf
  quote: |-
    福祉用具貸与及び特定福祉用具販売については、その特性と利用者の心身の状況等を踏まえて、その必要性を十分に検討せずに選定した場合、利用者の自立支援は大きく阻害されるおそれがあることから、検討の過程を別途記録する必要がある。
    このため、介護支援専門員は、居宅サービス計画に福祉用具貸与及び特定福祉用具販売を位置付ける場合には、サービス担当者会議を開催し、当該計画に福祉用具貸与及び特定福祉用具販売が必要な理由を記載しなければならない。
- rule: R04
  doc: "老企第22号（令和6年度改定の新旧対照表・新の欄）"
  where: "第２の３⑻㉔ 福祉用具貸与及び特定福祉用具販売の居宅サービス計画への反映（第22号・第23号）"
  source: rokig22_r6
  url: https://www.mhlw.go.jp/content/12300000/001227941.pdf
  quote: |-
    なお、福祉用具貸与については、居宅サービス計画作成後必要に応じて随時サービス担当者会議を開催して、利用者が継続して福祉用具貸与を受ける必要性について専門的意見を聴取するとともに検証し、継続して福祉用具貸与を受ける必要がある場合には、その理由を再び居宅サービス計画に記載しなければならない。なお、対象福祉用具の場合については、福祉用具専門相談員によるモニタリングの結果も踏まえること。
- rule: R04
  doc: "令和6年度介護報酬改定に関するQ&A（Vol.1）問113"
  where: "【居宅介護支援・介護予防支援】○ 福祉用具について 問113"
  source: qa_r6_vol1
  url: https://www.mhlw.go.jp/content/001227740.pdf
  quote: |-
    問113 福祉用具貸与については、居宅サービス計画又は介護予防サービス計画（以下「居宅サービス計画等」という。）作成後、利用者が継続して福祉用具貸与を受ける必要性について検証し、継続して福祉用具貸与を受ける必要がある場合には、その理由を再び居宅サービス計画等に記載しなければならないこととなっており、選択制の対象福祉用具の貸与を行った場合、福祉用具専門相談員が少なくとも６月以内にモニタリングを行い、その結果を居宅サービス計画等を作成した指定居宅支援事業者等に報告することとされているが、居宅サービス計画等の見直し又は継続理由の記載については福祉用具専門相談員のモニタリングと同様に６月以内に行う必要があるのか。
    （答）必ずしも６月以内に行う必要はないが、福祉用具専門相談員からモニタリングに関する情報提供があった後、速やかに居宅サービス計画等の見直し又は継続理由の記載を行うこと。
- rule: R06
  doc: "老企第22号（令和6年度改定の新旧対照表・新の欄）"
  where: "第２の３⑻⑮ モニタリングの実施（第14号）"
  source: rokig22_r6
  url: https://www.mhlw.go.jp/content/12300000/001227941.pdf
  quote: |-
    介護支援専門員は、モニタリングに当たっては、居宅サービス計画の作成後においても、利用者及びその家族、主治の医師、指定居宅サービス事業者等との連絡を継続的に行うこととし、当該指定居宅サービス事業者等の担当者との連携により、モニタリングが行われている場合においても、特段の事情のない限り、少なくとも１月に１回は利用者と面接を行い、かつ、少なくとも１月に１回はモニタリングの結果を記録することが必要である。また、面接は、原則、利用者の居宅を訪問することにより行うこととする。
- rule: R06
  doc: "老企第22号（令和6年度改定の新旧対照表・新の欄）"
  where: "第２の３⑻⑮ モニタリングの実施（第14号）"
  source: rokig22_r6
  url: https://www.mhlw.go.jp/content/12300000/001227941.pdf
  quote: |-
    ただし、基準第13条第14号ロ⑴及び⑵の要件を満たしている場合であって、少なくとも２月に１回利用者の居宅を訪問し、面接するときは、利用者の居宅を訪問しない月においては、テレビ電話装置等を活用して面接を行うことができる。なお、テレビ電話装置等を活用して面接を行う場合においても、利用者の状況に変化が認められた場合等においては、居宅を訪問することによる面接に切り替えることが適当である。
- rule: R06
  doc: "老企第22号（令和6年度改定の新旧対照表・新の欄）"
  where: "第２の３⑻⑮ モニタリングの実施（第14号）"
  source: rokig22_r6
  url: https://www.mhlw.go.jp/content/12300000/001227941.pdf
  quote: |-
    また、「特段の事情」とは、利用者の事情により、利用者の居宅を訪問し、利用者に面接することができない場合を主として指すものであり、介護支援専門員に起因する事情は含まれない。
    さらに、当該特段の事情がある場合については、その具体的な内容を記録しておくことが必要である。
    なお、基準第29条第２項の規定に基づき、モニタリングの結果の記録は、２年間保存しなければならない。
- rule: R06
  doc: "令和6年度介護報酬改定に関するQ&A（Vol.1）問110"
  where: "【居宅介護支援・介護予防支援】○ テレビ電話装置等を活用したモニタリングについて 問110"
  source: qa_r6_vol1
  url: https://www.mhlw.go.jp/content/001227740.pdf
  quote: |-
    問110 利用者に特段の事情がある場合には１月に１回（介護予防支援の場合は３月に１回）のモニタリングを行わなくてもよいが、利用者が使用するテレビ電話装置等のトラブルによりモニタリングが実施できなかった場合は特段の事情に該当するか。
    （答）該当しない。この場合は、利用者の居宅への訪問によるモニタリングに切り替えること。
- rule: R06
  doc: "令和6年度介護報酬改定に関するQ&A（Vol.1）問107"
  where: "【居宅介護支援・介護予防支援】○ テレビ電話装置等を活用したモニタリングについて 問107"
  source: qa_r6_vol1
  url: https://www.mhlw.go.jp/content/001227740.pdf
  quote: |-
    問107 居宅サービス計画又は介護予防サービス計画（以下「居宅サービス計画等」という。）を作成後、初回のモニタリングについてもテレビ電話装置等を活用して行うことは可能か。
    （答）要件を満たしていれば可能であるが、居宅サービス計画等の実施状況を適切に把握する観点から、初回のモニタリングは利用者の居宅を訪問して行い、その結果を踏まえた上で、テレビ電話装置等を活用したモニタリングが可能かどうかを検討することが望ましい。
