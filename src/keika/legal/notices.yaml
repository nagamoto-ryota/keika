    ｂ 相談（苦情を含む。以下同じ。）に応じ、適切に対応するために必要な体制の整備相談に対応する担当者をあらかじめ定めること等により、相談への対応のための窓口をあらかじめ定め、労働者に周知すること。
- rule: R28
  doc: "老企第22号（令和3年度改定の新旧対照表・新の欄）"
  where: "第２の３⒀④ロ 事業主が講じることが望ましい取組について［令和3年度改定時の番号］"
  source: rokig22_r3
  url: https://www.mhlw.go.jp/content/12300000/000869800.pdf
  quote: |-
    パワーハラスメント指針においては、顧客等からの著しい迷惑行為（カスタマーハラスメント）の防止のために、事業主が雇用管理上の配慮として行うことが望ましい取組の例として、①相談に応じ、適切に対応するために必要な体制の整備、②被害者への配慮のための取組（メンタルヘルス不調への相談対応、行為者に対して１人で対応させない等）及び③被害防止のための取組（マニュアル作成や研修の実施等、業種・業態等の状況に応じた取組）が規定されている。介護現場では特に、利用者又はその家族等からのカスタマーハラスメントの防止が求められていることから、イ（事業主が講ずべき措置の具体的内容）の必要な措置を講じるにあたっては、「介護現場におけるハラスメント対策マニュアル」、「（管理職・職員向け）研修のための手引き」等を参考にした取組を行うことが望ましい。
- rule: R31
  doc: "老企第22号（平成27年度改定とみられる新旧対照表・改正後の欄）"
  where: "第二の３⒂② 秘密保持［平成27年度改定時の番号］"
  source: rokig22_h27
  url: https://www.mhlw.go.jp/file/06-Seisakujouhou-12300000-Roukenkyoku/0000080876.pdf
  quote: |-
    同条第２項は、指定居宅介護支援事業者に対して、過去に当該指定居宅介護支援事業所の介護支援専門員その他の従業者であった者が、その業務上知り得た利用者又はその家族の秘密を漏らすことがないよう必要な措置を取ることを義務づけたものであり、具体的には、指定居宅介護支援事業者は、当該指定居宅介護支援事業所の介護支援専門員その他の従業者が、従業者でなくなった後においてもこれらの秘密を保持すべき旨を、従業者の雇用時に取り決め、例えば違約金についての定めを置くなどの措置を講ずべきこととするものである。
- rule: R32
  doc: "老企第22号（平成27年度改定とみられる新旧対照表・改正後の欄）"
  where: "第二の３⒅ 事故発生時の対応［平成27年度改定時の番号］"
  source: rokig22_h27
  url: https://www.mhlw.go.jp/file/06-Seisakujouhou-12300000-Roukenkyoku/0000080876.pdf
  quote: |-
    基準第27条は、利用者が安心して指定居宅介護支援の提供を受けられるよう事故発生時の速やかな対応を規定したものである。指定居宅介護支援事業者は、利用者に対する指定居宅介護支援の提供により事故が発生した場合は、市町村、当該利用者の家族等に連絡し、必要な措置を講じるべきこととするとともに、当該事故の状況及び事故に際して採った処置について記録し、また、利用者に対する指定居宅介護支援の提供により賠償すべき事故が発生した場合には、損害賠償を速やかに行うべきこととしたものである。
    なお、基準第29条第２項の規定に基づき、事故の状況及び事故に際して採った処置についての記録は、２年間保存しなければならない。
- rule: R32
  doc: "老企第22号（平成27年度改定とみられる新旧対照表・改正後の欄）"
  where: "第二の３⒅①〜③ 事故発生時の対応［平成27年度改定時の番号］"
  source: rokig22_h27
  url: https://www.mhlw.go.jp/file/06-Seisakujouhou-12300000-Roukenkyoku/0000080876.pdf
  quote: |-
    指定居宅介護支援事業者は、利用者に対する指定居宅介護支援の提供により事故が発生した場合の対応方法について、あらかじめ定めておくことが望ましいこと。
    ②指定居宅介護支援事業者は、賠償すべき事態となった場合には、速やかに賠償しなければならない。そのため、事業者は損害賠償保険に加入しておくか若しくは賠償資力を有することが望ましいこと。
    ③指定居宅介護支援事業者は、事故が生じた際にはその原因を解明し、再発生を防ぐための対策を講じること。
- rule: R33
  doc: "老企第22号（令和3年度改定の新旧対照表・新の欄）"
  where: "第２の３(24) 記録の整備［令和3年度改定時の番号］"
  source: rokig22_r3
  url: https://www.mhlw.go.jp/content/12300000/000869800.pdf
  quote: |-
    基準第29条第２項は、指定居宅介護支援事業者が同項各号に規定する記録を整備し、２年間保存しなければならないこととしたものである。
    なお、「その完結の日」とは、個々の利用者につき、契約終了（契約の解約・解除、他の施設への入所、利用者の死亡、利用者の自立等）により一連のサービス提供が終了した日を指すものとする。
- rule: R44
  doc: "老企第22号（令和6年度改定の新旧対照表・新の欄）"
  where: "第２の３⑷③ 要介護認定の申請に係る援助"
  source: rokig22_r6
  url: https://www.mhlw.go.jp/content/12300000/001227941.pdf
  quote: |-
    同条第３項は、要介護認定の有効期間が付されているものであることを踏まえ、指定居宅介護支援事業者は、要介護認定の有効期間を確認した上、要介護認定の更新の申請が、遅くとも当該利用者が受けている要介護認定の有効期間が終了する30日前にはなされるよう、必要な援助を行わなければならないこととしたものである。
- rule: R45
  doc: "老企第22号（平成27年度改定とみられる新旧対照表・改正後の欄）"
  where: "第二の３⑺⑮ 居宅サービス計画の変更の必要性についてのサービス担当者会議等による専門的意見の聴取（第15号）［平成27年度改定時の番号］"
  source: rokig22_h27
  url: https://www.mhlw.go.jp/file/06-Seisakujouhou-12300000-Roukenkyoku/0000080876.pdf
  quote: |-
    介護支援専門員は、利用者が要介護状態区分の変更の認定を受けた場合など本号に掲げる場合には、サービス担当者会議の開催により、居宅サービス計画の変更の必要性について、担当者から、専門的な見地からの意見を求めるものとする。ただし、やむを得ない理由がある場合については、サービス担当者に対する照会等により意見を求めることができるものとする。なお、ここでいうやむを得ない理由がある場合とは、開催の日程調整を行ったが、サービス担当者の事由により、サービス担当者会議への参加が得られなかった場合や居宅サービス計画の変更から間もない場合で利用者の状態に大きな変化が見られない場合等が想定される。
- rule: R45
  doc: "老企第22号（令和6年度改定の新旧対照表・新の欄）"
  where: "第２の３⑻⑰ 居宅サービス計画の変更（第16号）"
  source: rokig22_r6
  url: https://www.mhlw.go.jp/content/12300000/001227941.pdf
  quote: |-
    介護支援専門員は、居宅サービス計画を変更する際には、原則として、基準第13条第３号から第12号までに規定された居宅サービス計画作成に当たっての一連の業務を行うことが必要である。
- rule: R45
  doc: "介護保険最新情報Vol.959（令和3年3月31日）参考"
  where: "（２）居宅サービス計画書の更新の時期の明確化について"
  source: vol959
  url: https://www.mhlw.go.jp/content/000778912.pdf
  quote: |-
    したがって、指定居宅介護支援等の事業及び運営に関する基準（平成11年３月31日厚令38、以下「基準」という。）においても、モニタリングにより利用者の状態（解決すべき課題）に変化が認められる場合や、要介護認定の更新時において、居宅サービス計画書の更新（変更）を求めているところであり、これを周知徹底したい。
