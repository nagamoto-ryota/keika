  where: "第二の３⒂③ 秘密保持［平成27年度改定時の番号］"
  source: rokig22_h27
  url: https://www.mhlw.go.jp/file/06-Seisakujouhou-12300000-Roukenkyoku/0000080876.pdf
  quote: |-
    同条第３項は、介護支援専門員及び居宅サービス計画に位置付けた各居宅サービスの担当者が課題分析情報等を通じて利用者の有する問題点や解決すべき課題等の個人情報を共有するためには、あらかじめ、文書により利用者及びその家族から同意を得る必要があることを規定したものであるが、この同意については、指定居宅介護支援事業者が、指定居宅介護支援開始時に、利用者及びその家族の代表から、連携するサービス担当者間で個人情報を用いることについて包括的に同意を得ることで足りるものである。
- rule: R23
  doc: "老企第22号（令和6年度改定の新旧対照表・新の欄）"
  where: "第２の３⒂① 業務継続計画の策定等"
  source: rokig22_r6
  url: https://www.mhlw.go.jp/content/12300000/001227941.pdf
  quote: |-
    基準第19条の２は、指定居宅介護支援事業者は、感染症や災害が発生した場合にあっても、利用者が継続して指定居宅介護支援の提供を受けられるよう、指定居宅介護支援の提供を継続的に実施するための、及び非常時の体制で早期の業務再開を図るための計画（以下「業務継続計画」という。）を策定するとともに、当該業務継続計画に従い、介護支援専門員その他の従業者に対して、必要な研修及び訓練（シミュレーション）を実施しなければならないこととしたものである。
- rule: R23
  doc: "老企第22号（令和6年度改定の新旧対照表・新の欄）"
  where: "第２の３⒂② 業務継続計画の策定等"
  source: rokig22_r6
  url: https://www.mhlw.go.jp/content/12300000/001227941.pdf
  quote: |-
    業務継続計画には、以下の項目等を記載すること。なお、各項目の記載内容については、「介護施設・事業所における感染症発生時の業務継続ガイドライン」及び「介護施設・事業所における自然災害発生時の業務継続ガイドライン」を参照されたい。また、想定される災害等は地域によって異なるものであることから、項目については実態に応じて設定すること。なお、感染症及び災害の業務継続計画を一体的に策定することを妨げるものではない。さらに、感染症に係る業務継続計画並びに感染症の予防及びまん延の防止のための指針については、それぞれに対応する項目を適切に設定している場合には、一体的に策定することとして差し支えない。
- rule: R23
  doc: "老企第22号（令和3年度改定の新旧対照表・新の欄）"
  where: "第２の３⒁③ 業務継続計画の策定等［令和3年度改定時の番号］"
  source: rokig22_r3
  url: https://www.mhlw.go.jp/content/12300000/000869800.pdf
  quote: |-
    研修の内容は、感染症及び災害に係る業務継続計画の具体的内容を職員間に共有するとともに、平常時の対応の必要性や、緊急時の対応にかかる理解の励行を行うものとする。
    職員教育を組織的に浸透させていくために、定期的（年１回以上）な教育を開催するとともに、新規採用時には別に研修を実施することが望ましい。また、研修の実施内容についても記録すること。なお、感染症の業務継続計画に係る研修については、感染症の予防及びまん延の防止のための研修と一体的に実施することも差し支えない。
- rule: R23
  doc: "老企第22号（令和3年度改定の新旧対照表・新の欄）"
  where: "第２の３⒁④ 業務継続計画の策定等［令和3年度改定時の番号］"
  source: rokig22_r3
  url: https://www.mhlw.go.jp/content/12300000/000869800.pdf
  quote: |-
    訓練（シミュレーション）においては、感染症や災害が発生した場合において迅速に行動できるよう、業務継続計画に基づき、事業所内の役割分担の確認、感染症や災害が発生した場合に実践するケアの演習等を定期的（年１回以上）に実施するものとする。なお、感染症の業務継続計画に係る訓練については、感染症の予防及びまん延の防止のための訓練と一体的に実施することも差し支えない。
    訓練の実施は、机上を含めその実施手法は問わないものの、机上及び実地で実施するものを適切に組み合わせながら実施することが適切である。
- rule: R24
  doc: "老企第22号（令和6年度改定の新旧対照表・新の欄）"
  where: "第２の３⒄イ 感染症の予防及びまん延の防止のための対策を検討する委員会"
  source: rokig22_r6
  url: https://www.mhlw.go.jp/content/12300000/001227941.pdf
  quote: |-
    感染対策委員会は、利用者の状況など事業所の状況に応じ、おおむね６月に１回以上、定期的に開催するとともに、感染症が流行する時期等を勘案して必要に応じ随時開催する必要がある。
- rule: R24
  doc: "老企第22号（令和6年度改定の新旧対照表・新の欄）"
  where: "第２の３⒄イ 感染症の予防及びまん延の防止のための対策を検討する委員会"
  source: rokig22_r6
  url: https://www.mhlw.go.jp/content/12300000/001227941.pdf
  quote: |-
    感染対策委員会は、居宅介護支援事業所の従業者が１名である場合は、ロの指針を整備することで、委員会を開催しないことも差し支えない。この場合にあっては、指針の整備について、外部の感染管理等の専門家等と積極的に連携することが望ましい。
- rule: R24
  doc: "老企第22号（令和3年度改定の新旧対照表・新の欄）"
  where: "第２の３⒃ロ 感染症の予防及びまん延の防止のための指針［令和3年度改定時の番号］"
  source: rokig22_r3
  url: https://www.mhlw.go.jp/content/12300000/000869800.pdf
  quote: |-
    当該事業所における「感染症の予防及びまん延の防止のための指針」には、平常時の対策及び発生時の対応を規定する。
    平常時の対策としては、事業所内の衛生管理（環境の整備等）、ケアにかかる感染対策（手洗い、標準的な予防策）等、発生時の対応としては、発生状況の把握、感染拡大の防止、医療機関や保健所、市町村における事業所関係課等の関係機関との連携、行政等への報告等が想定される。また、発生時における事業所内の連絡体制や上記の関係機関への連絡体制を整備し、明記しておくことも必要である。
