  legal_basis: 居宅基準13条8号・6号、予防基準30条8号
  basis_confirmed: true
  source: 豊島区18件、鳥取市、京都市、福井市、和歌山県
  judge: claude
  done_when: アセスメントの課題がプランに入り、プランのサービスの理由がアセスメントで説明できること
  active: true
  applies_to: both
