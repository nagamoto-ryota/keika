# 点検表。1行 = 1点検。日付で自動に切り替わる。
#
# 事前の調査（複数の自治体が公開した指摘事項と国の確認項目）を元に、期間中に作成した。
# 自治体資料の番号は条例の番号なので、根拠は省令の番号で書いている。
#
# 動かす行（active: true）は、架空データの穴を見る前に次の基準で決めて固定した。穴に合わせて選んでいない。
#   1. 指摘の頻度: 豊島区の件数が3以上、または盛岡市の件数が5以上、または指摘を載せた自治体が3つ以上
#   2. 報酬（加算・減算）の行は動かさない（請求は作品の範囲外）
#   3. 判定に人の判断が欠かせない行は動かさない（judge: human）
#   例外: R44（更新申請の援助）と R45（計画の期限）は指摘ではなく先回りの知らせなので、頻度によらず動かす
#
# 件数が数えられる資料は豊島区だけで、全国の傾向を表す数字ではない。
# basis_confirmed: false の行は、画面に条文を出さず「根拠確認中」と出す。
# not_required: true の行は「義務が無いので指摘しない」ことを持つ行（よくある誤解の防止）。
#
# judge: machine = 読み取り結果の日付と有無の計算。claude = 文章を読んで判断。human = 人に確認を促すだけ。
# applies_to: kyotaku = 居宅介護支援、yobo = 介護予防支援、both = 両方。

- id: R01
  title: 担当者会議と全事業所からの意見
  plain: 新規・変更・更新のたびに担当者会議を開き、来られない事業所からも意見をもらって記録します。
  layer: 利用者書類
  legal_basis: 居宅基準13条9号・15号、予防基準30条9号・17号
  basis_confirmed: true
  source: 豊島区19件、京都市、秋田市、鹿児島市、和歌山県、沼津市
  source_url: https://www.city.numazu.shizuoka.jp/kurashi/fukushi/kaigo/jigyosha/syudanshidou/doc/r06_2.pdf
  judge: claude
  done_when: 計画の作成・変更のたびに、計画に載る全事業所の出席か照会の中身が会議の要点にあること
  active: true
  applies_to: both
- id: R02
  title: アセスメントとプランの整合
  plain: プランに載せたサービスの必要性が、アセスメントで説明できるかを確かめます。
