# 判定表（測定用）。answer_key.csv の1行につき1項目。すべて架空データ。
# 根拠の正本は fake_data/drive/ の実物。ファイルは drive/ からの相対パスで書く。
meta:
  基準日: 2026-11-04        # 00_設計.md 1節の「今日」。データの期間は 2026-08-01〜2026-11-03
  項目数: 30                # finding 21 / nudge 2 / silent 5 / intake 1 / unknown 1
  当たりの条件: >-
    利用者（事業所の項目は事業所）＋根拠箇所＋理由が、すべて合う時だけ当たり。
    根拠箇所は role: primary の evidence のうち1つ以上を指していること。
    理由は must_mention の全グループで、any_of のどれかに当たる内容（言い換えも可）を含むこと。
    点検項目の番号が合うだけでは当たりにしない。not_hit_if に当たる指摘は外れ。
  区分の読み方:
    finding: 指摘の穴。上の条件で当たりを判定する
    nudge: 先回りの穴（H12、H13）。指摘とは別に数える
    silent: 罠。must_mention は「この内容で指摘したら誤り」の条件として読む。ok_if に当たるものは誤りにしない
    intake: 入口の試験（T04）。must_mention は取り込み結果の合格条件。点検の指摘としては数えない
    unknown: 「分からない」と出して確認を促すのが正解（O04）。当たりにも誤りにも入れず、別に数える
  judge_kind: 見出しの数字を分けるための区分。読み取り結果の計算で判定できるものは machine、文章を読む必要があるものは claude
  needs_inbox: >-
    入口の素材を取り込んだ後でないと項目が成り立たない時だけ true。
    false の項目は取り込み前の drive/利用者・drive/事業所 の実物だけで成り立つ。
    evidence_after_inbox は取り込み後に増える根拠で、これだけを示した指摘は取り込み前の測定では当たりにしない。
  evidence_の欄: >-
    file=drive/ からの相対パス、role=primary（当たりに必要）/supporting（補強）、
    page=PDF のページ、date=CSV の日付列、sheet と cell=Excel の場所、quote=実物にある語句、
    scan=true は文字の層がない画像で、seen に目で確かめた内容を書く、absent_terms=その箇所に無い語。
  数えない項目: U04 の 10月の夜間頻尿の増加（00_設計.md のグレー）。指摘されても当たりにも誤りにもしない

