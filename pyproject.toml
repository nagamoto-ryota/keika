[project]
name = "keika"
version = "0.1.0"
description = "話すだけで支援経過。Drive の書類と突き合わせて先回りで知らせるケアマネ向けアプリ"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.80",
  "fastapi>=0.110",
  "jinja2>=3.1",
  "openpyxl>=3.1",
  "pydantic>=2.6",
  "pypdf>=4",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
keika = "keika.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keika = ["rules.yaml", "skills/*.md", "web/templates/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
